services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure-auth-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:////app/data/secure_auth.db
    volumes:
      - auth_data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  auth_data:
    name: secure_auth_data
